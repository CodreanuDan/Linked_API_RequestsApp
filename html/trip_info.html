<div class="trip-info-container">
    <div class="trip-info-header">
        <span class="trip-info-title">🚙 Route Information</span>
    </div>
    <div class="trip-info-content">
        <div class="trip-info-item">
            <span class="emoji">🗺️</span><strong> Distance:</strong> <span class="distance">{distance} km</span>
        </div>
        <div class="trip-info-item">
            <span class="emoji">🕰️</span><strong> Duration:</strong> <span class="duration">{duration} hours</span>
        </div>
    </div>
</div>
